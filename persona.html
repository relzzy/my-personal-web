<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Relzzy's Webpage</title>
    <link rel="icon" href="images/RELZZY_logo.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Titillium+Web:ital,wght@0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">

    <style>
        /* Basic setup */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Oswald', sans-serif;
            margin: 0;
            overflow: hidden;
            display: flex;
            min-height: 100vh;
            color: #ffffff;
            position: relative;
            background-color: #030a1a;
        }

        /* --- CHARACTER ART --- */
        .character-art {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -10;
            pointer-events: none;
            filter: brightness(1.1);
        }

        /* --- BACKEND STATUS (WALLET / P3 BADGE STYLE) --- */
        .backend-status {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #ffffff;
            color: #000000;
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            padding: 10px 22px;
            border: 4px solid #00f0ff;
            z-index: 9999;
            transform: skewX(-10deg) rotate(-3deg);
            box-shadow: -8px 8px 0px #ff0055, 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* --- NAVIGATION (RIGHT-ALIGNED STAIRCASE PERSONA STYLE) --- */
        .nav-container {
            position: fixed;
            right: 5%;
            top: 50%;
            transform: translateY(-50%) skewY(-8deg);
            display: flex;
            flex-direction: column;
            z-index: 9999;
        }

        nav {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }

        nav a {
            font-size: clamp(2.3rem, 4.5vw, 4.2rem);
            font-weight: 900;
            font-style: italic;
            text-decoration: none;
            text-transform: uppercase;
            color: #ffffff;
            background: transparent;
            padding: 8px 24px;
            position: relative;
            z-index: 100;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;

            /* Edge definition for raised look */
            -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.8);
            paint-order: stroke fill;

            /* 3D Extruded shadow — stacked layers create depth */
            text-shadow:
                0 1px 0 #1a1a1a,
                0 2px 0 #1a1a1a,
                1px 3px 0 #111111,
                1px 4px 0 #111111,
                2px 5px 0 #0a0a0a,
                2px 6px 0 #0a0a0a,
                3px 7px 0 #050505,
                3px 8px 0 #050505,
                3px 9px 0 #000000,
                4px 10px 0 #000000,
                4px 12px 8px rgba(0, 0, 0, 0.5),
                0 0 5px rgba(0, 240, 255, 0.2);

            /* Smooth transition for hover lift */
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                        text-shadow 0.25s ease-out,
                        color 0.2s ease,
                        background 0.2s ease;
        }
        @keyframes bobbing {
            0%, 100% {
                transform: translate(-4px, -6px);
            }
            50% {
                transform: translate(-4px, -14px);
            }
        }

        /* 3D Hover: text lifts upward, shadow extends */
        nav a:hover {
            color: #00f0ff;
            -webkit-text-stroke: 1.5px rgba(0, 50, 100, 0.8);
            transform: translate(-4px, -6px);
            z-index: 110;
            animation: bobbing 1.5s ease-in-out infinite alternate;

            text-shadow:
                0 1px 0 #002a3a,
                0 2px 0 #002a3a,
                1px 3px 0 #001f2b,
                1px 4px 0 #001f2b,
                2px 5px 0 #00151c,
                2px 6px 0 #00151c,
                3px 7px 0 #000c11,
                3px 8px 0 #000c11,
                3px 9px 0 #00080a,
                4px 10px 0 #ff0055,
                5px 12px 0 #ff0055,
                6px 14px 0 #000000,
                6px 16px 12px rgba(0, 0, 0, 0.6),
                0 0 25px rgba(0, 240, 255, 0.6);
        }

        /* SPECIAL HIGHLIGHT STYLING FOR PROJECTS BUTTON */
        nav a.p3-projects-link {
            position: relative;
        }

        nav a.p3-projects-link::after {
            content: 'NEW';
            font-size: 0.75rem;
            font-family: 'Titillium Web', sans-serif;
            font-weight: 900;
            font-style: normal;
            background: #ff0055;
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 2px;
            transform: skewX(-12deg);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
            -webkit-text-stroke: 0px;
            text-shadow: none;
            letter-spacing: 1px;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Active/pressed: text pushes back down */
        nav a:active {
            transform: translate(1px, 2px);
            text-shadow:
                0 1px 0 #1a1a1a,
                0 2px 0 #0a0a0a,
                1px 3px 0 #050505,
                1px 4px 0 #000000,
                1px 5px 6px rgba(0, 0, 0, 0.4);
            transition: transform 0.08s ease-out,
                        text-shadow 0.08s ease-out;
        }

        /* --- EASTER EGG BANNER --- */
        .easter-egg-banner {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            background: #030a1a;
            padding: 20px 40px;
            border: 4px solid #00f0ff;
            box-shadow: -10px 10px 0px #ff0055;
            text-align: center;
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .easter-egg-banner.show {
            transform: translateX(-50%) translateY(0);
        }

        .easter-egg-banner h2 {
            color: #00f0ff;
            margin: 0;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            -webkit-text-stroke: 1px #fff;
        }

        .easter-egg-banner p {
            color: #fff;
            margin-top: 5px;
            font-weight: 700;
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .character-art {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 100vw;
                object-fit: cover;
                object-position: 85% center;
            }

            .nav-container {
                right: auto;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                align-items: center;
                width: 90%;
            }

            nav {
                align-items: center;
            }

            nav a {
                font-size: 2.2rem;
                text-align: center;
                white-space: nowrap;

                /* Scaled-down 3D shadow for smaller text */
                -webkit-text-stroke: 1px rgba(0, 0, 0, 0.6);
                text-shadow:
                    0 1px 0 #1a1a1a,
                    0 2px 0 #111111,
                    1px 3px 0 #0a0a0a,
                    1px 4px 0 #050505,
                    2px 5px 0 #000000,
                    2px 6px 0 #000000,
                    2px 7px 6px rgba(0, 0, 0, 0.4);
            }

            .backend-status {
                left: 50%;
                transform: translateX(-50%);
                bottom: 15px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>

    <video class="character-art" autoplay muted playsinline>
        <source src="images/sona.mp4" type="video/mp4">

    <!-- Link back to surreal ethereal 3D world -->
    <a href="index.html" style="position: fixed; top: 18px; left: 20px; background: rgba(0,0,0,0.85); color: #00f0ff; border: 2px solid #00f0ff; font-family: 'Oswald', sans-serif; font-size: 1.05rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 18px; text-decoration: none; z-index: 10000; border-radius: 4px; box-shadow: 0 4px 15px rgba(0,240,255,0.4); transition: all 0.2s ease;">⚡ RETURN TO ETHEREAL 3D WORLD</a>

    <div class="backend-status">BACKEND: LIVE</div>

    <div class="nav-container">
        <nav>
            <a href="https://cue-web-nine.vercel.app/" target="_blank" rel="noopener noreferrer">CUE WORKSPACE</a>
            <a href="https://relzzy.github.io/text_rpg_demo/">PLAY RPG DEMO</a>

            <a href="project.html" class="p3-projects-link">PROJECTS</a>
            <a href="test.html">GOALS</a>
            <a href="input.html">REACH OUT</a>
            <a href="about.html">ABOUT</a>
        </nav>
    </div>

    <div id="secret-banner" class="easter-egg-banner">
        <h2>🎉 SECRET FOUND! 🎉</h2>
        <p>You truly know this place.</p>
    </div>

    <script>
        let inputSequence = '';

        // We listen for key presses
        window.addEventListener('keydown', (e) => {
            // Add key to sequence
            inputSequence += e.key.toLowerCase();

            // Keep sequence manageable (last 10 chars is enough for our words)
            if (inputSequence.length > 10) {
                inputSequence = inputSequence.slice(-10);
            }

            // 1. Check for 'anime' -> REDIRECT
            if (inputSequence.includes('anime')) {
                // Reset sequence to prevent double triggers
                inputSequence = '';
                // Redirect
                window.location.href = 'anime.html';
            }

            // 2. Check for 'relzzy' -> BANNER
            if (inputSequence.includes('relzzy')) {
                inputSequence = '';
                activateBanner();
            }
        });

        function activateBanner() {
            const banner = document.getElementById('secret-banner');
            banner.classList.add('show');
            setTimeout(() => {
                banner.classList.remove('show');
            }, 4000);
        }

        // Video lifecycle management
        const charVideo = document.querySelector('video.character-art');
        if (charVideo) {
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    charVideo.pause();
                } else {
                    charVideo.play().catch(() => {});
                }
            });
        }
    </script>

</body>

</html>
