<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect - Relzzy's Portfolio</title>
    <link rel="icon" href="images/RELZZY_logo.svg" type="image/svg+xml">

    <!-- Google Fonts for authentic P3R high-contrast typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Poppins:wght@400;600;700;900&family=Titillium+Web:ital,wght@0,700;0,900;1,700;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/arcade-player.css">

    <style>
        /* ========================================
           PERSONA 3 RELOAD SYSTEM ANIMATIONS & KEYFRAMES
           ======================================== */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px) skewX(-4deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) skewX(-4deg);
            }
        }

        @keyframes p3Pulse {

            0%,
            100% {
                box-shadow: -8px 8px 0px #00d4ff, 0 0 15px rgba(0, 212, 255, 0.4);
            }

            50% {
                box-shadow: -10px 10px 0px #ff0055, 0 0 25px rgba(255, 0, 85, 0.6);
            }
        }

        @keyframes gentlePulse {
            0% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.8;
            }
        }

        /* ========================================
           RESET & BASE
           ======================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #e6f7ff;
            min-height: 100vh;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            background-color: #030a1a;
        }

        /* ========================================
           BACKGROUND & P3 ATMOSPHERIC OVERLAY
           ======================================== */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('images/reachout.png');
            background-size: cover;
            background-position: center;
            z-index: -10;
            filter: brightness(1.1) contrast(1.05);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Adjust gradient to be darker on the left to read text easily */
            background: linear-gradient(90deg, rgba(3, 10, 26, 0.8) 0%, rgba(10, 30, 75, 0.4) 40%, transparent 100%);
            z-index: -9;
            pointer-events: none;
        }

        .p3-pattern-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image:
                radial-gradient(rgba(0, 240, 255, 0.15) 1px, transparent 0),
                linear-gradient(135deg, transparent 45%, rgba(0, 162, 255, 0.08) 50%, transparent 55%);
            background-size: 24px 24px, 200px 200px;
            z-index: -8;
            pointer-events: none;
        }

        .p3-bg-watermark {
            position: fixed;
            bottom: -50px;
            right: -20px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 18vw;
            font-weight: 900;
            font-style: italic;
            color: rgba(0, 240, 255, 0.05);
            letter-spacing: -5px;
            user-select: none;
            z-index: -7;
            pointer-events: none;
            text-transform: uppercase;
        }

        /* ========================================
           SCROLLBAR
           ======================================== */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(3, 15, 38, 0.8);
            border-left: 1px solid rgba(0, 240, 255, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00f0ff, #0066ff);
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.8);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff0055;
        }

        /* ========================================
           TOP P3 SYSTEM HEADER BAR
           ======================================== */
        .p3-top-bar {
            width: 100%;
            height: 46px;
            background: linear-gradient(90deg, #00a2ff 0%, #0033aa 40%, rgba(3, 10, 26, 0.85) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
            border-bottom: 3px solid #00f0ff;
            position: relative;
            z-index: 10;
            transform: skewX(-6deg);
            margin-top: 10px;
        }

        .p3-top-bar-content {
            transform: skewX(6deg);
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            justify-content: space-between;
        }

        .p3-logo-tag {
            font-family: 'Titillium Web', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .p3-logo-tag span.badge {
            background: #ff0055;
            color: #ffffff;
            padding: 2px 10px;
            font-size: 0.85rem;
            font-style: normal;
            font-weight: 900;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .p3-guide-prompt {
            font-family: 'Titillium Web', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .p3-guide-prompt span.key {
            background: #ffffff;
            color: #002266;
            padding: 1px 8px;
            border-radius: 3px;
            font-weight: 900;
            box-shadow: 0 2px 0px #00f0ff;
        }

        /* ========================================
           MAIN CONTENT AREA
           ======================================== */
        .page-wrapper {
            display: flex;
            justify-content: flex-start;
            /* Align content to the left */
            align-items: center;
            /* Vertically center */
            padding: 40px 10vw;
            /* 10vw offset from left */
            width: 100%;
            max-width: 100vw;
            min-height: calc(100vh - 60px);
            perspective: 1200px;
        }

        .contact-container {
            width: 100%;
            max-width: 650px;
            background: rgba(3, 14, 38, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid #00f0ff;
            border-left: 8px solid #00f0ff;
            /* Left border thicker */
            padding: 45px 50px;
            transform: skewX(-4deg);
            box-shadow: -14px 14px 0px rgba(0, 0, 0, 0.6), 0 0 35px rgba(0, 162, 255, 0.35);
            position: relative;
            z-index: 4;
            animation: fadeInUp 0.8s cubic-bezier(0.15, 0.85, 0.35, 1.2);
        }

        .contact-container::after {
            content: 'COMMS // SYSTEM LINK';
            position: absolute;
            top: -16px;
            right: 30px;
            background: #00f0ff;
            color: #020817;
            font-family: 'Titillium Web', sans-serif;
            font-size: 0.8rem;
            font-weight: 900;
            font-style: italic;
            padding: 3px 14px;
            letter-spacing: 2px;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            box-shadow: 0 4px 10px rgba(0, 240, 255, 0.5);
        }

        .contact-content {
            transform: skewX(4deg);
            /* Un-skew inner text */
        }

        .contact-content h1 {
            font-family: 'Titillium Web', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            font-style: italic;
            color: #ffffff;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #002244, 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .contact-content h1::before {
            content: '';
            display: inline-block;
            width: 15px;
            height: 40px;
            background: #ff0055;
            transform: skewX(-15deg);
            box-shadow: -4px 4px 0px #00f0ff;
        }

        .contact-content .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #00f0ff;
            margin-bottom: 35px;
            padding-left: 30px;
            letter-spacing: 1.5px;
            border-bottom: 3px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 15px;
            text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
        }

        /* --- FORM STYLES --- */
        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-family: 'Titillium Web', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            font-style: italic;
            margin-bottom: 8px;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 0px #000;
        }

        .form-group label::before {
            content: '◆';
            color: #ff0055;
            margin-right: 8px;
            text-shadow: 0 0 8px #ff0055;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 1.05rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            background: rgba(4, 25, 65, 0.6);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-left: 4px solid #00f0ff;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            background: rgba(0, 162, 255, 0.15);
            border-color: #ffffff;
            border-left-color: #ff0055;
            box-shadow: -4px 4px 10px rgba(0, 240, 255, 0.3);
            transform: translateX(4px);
        }

        .form-group select option {
            background: #030a1a;
            color: #00f0ff;
            font-weight: 600;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(0, 240, 255, 0.4);
            font-style: italic;
        }

        /* --- SUBMIT BUTTON --- */
        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 1.25rem;
            font-weight: 900;
            font-style: italic;
            color: #020817;
            background: linear-gradient(90deg, #00f0ff 0%, #0066ff 100%);
            border: 2px solid #ffffff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            transform: skewX(-6deg);
            box-shadow: -8px 8px 0px #ff0055;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .submit-btn:hover {
            background: #ff0055;
            color: #ffffff;
            transform: skewX(-6deg) translate3d(6px, -4px, 0);
            box-shadow: -12px 12px 0px #00f0ff, 0 0 25px rgba(255, 0, 85, 0.8);
            border-color: #ffffff;
        }

        .submit-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: -8px 8px 0px #222;
            cursor: not-allowed;
            border-color: #555;
            transform: skewX(-6deg);
        }

        .submit-btn-inner {
            transform: skewX(6deg);
            /* un-skew text */
            display: inline-block;
            width: 100%;
        }

        /* --- SYSTEM NOTICE --- */
        .delay-notice {
            margin-top: 25px;
            padding: 14px 18px;
            background: rgba(255, 0, 85, 0.1);
            border: 1px solid rgba(255, 0, 85, 0.4);
            border-left: 4px solid #ff0055;
            color: #e0e0e0;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: gentlePulse 2s infinite alternate;
        }

        .delay-notice .notice-icon {
            font-size: 1.5rem;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        .delay-notice strong {
            color: #ff0055;
        }

        /* ========================================
           BACK TO HOME BUTTON (3D Persona Style)
           ======================================== */
        .back-button-wrap {
            margin-top: 40px;
            perspective: 600px;
            display: flex;
            justify-content: flex-start;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: 'Titillium Web', sans-serif;
            font-size: 1.1rem;
            font-weight: 900;
            font-style: italic;
            text-decoration: none;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 14px 28px;
            background: linear-gradient(90deg, #ff0055 0%, #cc0044 100%);
            border: 2px solid #ffffff;
            transform: skewX(-10deg) translate3d(0, 0, 0);
            box-shadow: -8px 8px 0px #00f0ff, 0 0 20px rgba(255, 0, 85, 0.4);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .back-button span.btn-icon {
            background: #ffffff;
            color: #ff0055;
            font-weight: 900;
            font-style: normal;
            padding: 2px 10px;
            border-radius: 50%;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .back-button:hover {
            background: #00f0ff;
            color: #020817;
            border-color: #ffffff;
            transform: skewX(-10deg) translate3d(8px, -6px, 10px);
            box-shadow: -12px 12px 0px #ff0055, 0 0 30px rgba(0, 240, 255, 0.9);
        }

        .back-button:hover span.btn-icon {
            background: #020817;
            color: #00f0ff;
        }

        @media (max-width: 900px) {
            .page-wrapper {
                padding: 40px 5vw;
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .p3-top-bar {
                padding: 0 15px;
            }

            .p3-top-bar-content {
                justify-content: center;
            }

            .p3-guide-prompt {
                display: none;
            }

            .p3-logo-tag {
                font-size: 1rem;
                text-align: center;
            }

            .contact-container {
                padding: 30px 20px;
                transform: skewX(0);
                border-left: 2px solid #00f0ff;
                box-shadow: 0 0 35px rgba(0, 162, 255, 0.35);
            }

            .contact-content {
                transform: skewX(0);
            }

            .submit-btn {
                transform: skewX(0);
                box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            }

            .submit-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 6px 20px rgba(255, 0, 85, 0.6);
            }

            .submit-btn-inner {
                transform: skewX(0);
            }

            .back-button {
                transform: skewX(0);
                box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            }

            .back-button:hover {
                transform: translateY(-5px);
                box-shadow: 0 6px 20px rgba(0, 240, 255, 0.6);
            }
        }
    </style>
</head>

<body>

    <!-- Background Image with P3 Filters -->
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="p3-pattern-overlay"></div>
    <div class="p3-bg-watermark">P3 RELOAD // SYSTEM</div>

    <!-- P3 Top System Bar -->
    <div class="p3-top-bar">
        <div class="p3-top-bar-content">
            <div class="p3-logo-tag">
                <span class="badge">SYSTEM</span> RELZZY'S ARCHIVE // COMMS
            </div>
            <div class="p3-guide-prompt">
                <span class="key">ESC</span> MAIN MENU
            </div>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="contact-container">
            <div class="contact-content">
                <!-- Title -->
                <h1>GET IN TOUCH</h1>

                <!-- Subtitle -->
                <p class="subtitle">INITIATE CONNECTION / TRANSMIT DATA</p>

                <form id="contact-form" method="POST" action="https://relzzy-backend.onrender.com/contact">

                    <div class="form-group">
                        <label for="name">USER DESIGNATION</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">NETWORK ADDRESS</label>
                        <input type="email" id="email" name="email" placeholder="email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">COMMUNICATION VECTOR</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Select Protocol...</option>
                            <option value="Game Dev">Game Development Collab</option>
                            <option value="AI/ML">AI / Machine Learning</option>
                            <option value="Web3">Web3 / Crypto Gaming</option>
                            <option value="General">Just Saying Hi!</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">DATA PAYLOAD</label>
                        <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="submit-btn-inner">TRANSMIT DATA 🚀</span>
                    </button>

                    <div class="delay-notice">
                        <span class="notice-icon">⚠</span>
                        <div>
                            <strong>SYSTEM DELAY:</strong> The relay server may take 30-40 seconds to power on.<br>
                            Please hold this interface open until confirmation is received.
                        </div>
                    </div>

                </form>

                <!-- Back button -->
                <div class="back-button-wrap" style="display: flex; flex-direction: column; gap: 10px;">
                    <a href="persona.html" class="back-button">
                        <span class="btn-icon">B</span> PERSONA HOME
                    </a>
                    <a href="index.html" class="back-button" style="background: linear-gradient(90deg, #d4af37 0%, #aa820a 100%); box-shadow: -6px 6px 0px #000, 0 0 15px rgba(212, 175, 55, 0.4); color: #000;">
                        <span class="btn-icon" style="color: #aa820a; background: #000;">⚡</span> PRO THEME
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Form submission logic
        const contactForm = document.getElementById('contact-form');
        const submitBtn = contactForm.querySelector('.submit-btn');
        const submitBtnInner = contactForm.querySelector('.submit-btn-inner');

        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtnInner.textContent = 'TRANSMITTING...';

            const formData = new FormData(contactForm);
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            try {
                const response = await fetch(contactForm.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Data Transmitted Successfully! 🚀 Connection established.');
                    contactForm.reset();
                } else {
                    alert('System Error: ' + (result.message || 'Transmission failed.'));
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                alert('Connection Failed! Please check if the backend is awake.');
            } finally {
                submitBtn.disabled = false;
                submitBtnInner.textContent = 'TRANSMIT DATA 🚀';
            }
        });

        // Keyboard Shortcuts (ESC for home)
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
            if (e.key === 'Escape' || e.key === 'Esc') {
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="assets/js/arcade-config.js" defer></script>
    <script src="assets/js/arcade-player.js" defer></script>
</body>

</html>
