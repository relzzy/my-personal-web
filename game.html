<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Game - Relzzy</title>
    <link rel="icon" href="images/RELZZY_logo.svg" type="image/svg+xml">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-base: #060608;
            --bg-surface: #0e1118;
            --bg-card: rgba(18, 22, 32, 0.75);
            --gold-primary: #d4af37;
            --gold-light: #f5e6a8;
            --gold-glow: rgba(212, 175, 55, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-gold: rgba(212, 175, 55, 0.4);
            --cyan-accent: #00ffff;
            --text-primary: #f8f9fa;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(var(--gold-glow) 1px, transparent 0),
                radial-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 0);
            background-size: 32px 32px, 64px 64px;
        }

        /* Top Bar */
        header {
            width: 100%;
            max-width: 1040px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-badge {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            font-weight: 800;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 1px;
        }

        .brand-title {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: var(--gold-primary);
            color: var(--gold-light);
        }

        /* Game Container */
        .game-wrapper {
            width: 100%;
            max-width: 1040px;
            background: #000;
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .game-screen {
            width: 100%;
            height: 0;
            padding-bottom: 66.67%; /* 960x640 aspect ratio */
            position: relative;
            background: #050608;
        }

        .game-screen iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Instructions & Details Footer */
        .game-footer {
            padding: 16px 24px;
            background: var(--bg-surface);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .controls-guide {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .key-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1e2433;
            border: 1px solid #364259;
            color: var(--cyan-accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            box-shadow: 0 2px 0 #111622;
        }

        .game-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38ef7d;
            box-shadow: 0 0 8px #38ef7d;
            display: inline-block;
        }

        @media (max-width: 680px) {
            .game-footer {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <a href="index.html" class="brand">
            <span class="brand-badge">SVG GAME</span>
            <span class="brand-title">Executive Suite // Interactive Room</span>
        </a>

        <div class="header-actions">
            <a href="game.svg" target="_blank" class="btn-outline">
                <span>↗ Open Raw SVG</span>
            </a>
            <button id="fullscreen-btn" class="btn-outline">
                <span>⛶ Fullscreen</span>
            </button>
            <a href="index.html" class="btn-outline">
                <span>← Home</span>
            </a>
        </div>
    </header>

    <!-- Game Card / Frame -->
    <div class="game-wrapper" id="game-container">
        <div class="game-screen">
            <iframe id="game-frame" src="game.svg" allow="autoplay"></iframe>
        </div>

        <div class="game-footer">
            <div class="controls-guide">
                <div>
                    <span>Movement:</span> 
                    <span class="key-badge">W</span> <span class="key-badge">A</span> <span class="key-badge">S</span> <span class="key-badge">D</span> or <span class="key-badge">▲</span><span class="key-badge">◄</span><span class="key-badge">▼</span><span class="key-badge">►</span>
                </div>
                <div>
                    <span>Interact &amp; Doors:</span> 
                    <span class="key-badge">E</span> or <span class="key-badge">Enter</span> <span style="font-size: 11px; color: #ffd166;">([E] Doors)</span> <span style="font-size: 11px; color: #00ffff;">([E] Workstation)</span>
                </div>
                <div>
                    <span>Close Menu:</span> 
                    <span class="key-badge">ESC</span>
                </div>
            </div>

            <div class="game-meta">
                <span><span class="status-dot"></span> Zones: Balcony (Apartment View) • Bedroom • Bathroom • Living Room</span>
                <span><span style="color: #00ffff;">●</span> Workstation: Interactive</span>
            </div>
        </div>
    </div>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const gameContainer = document.getElementById('game-container');
        const gameFrame = document.getElementById('game-frame');

        // Focus game frame on load and click
        window.addEventListener('load', () => {
            try {
                gameFrame.contentWindow.focus();
            } catch(e) {}
        });

        gameContainer.addEventListener('click', () => {
            try {
                gameFrame.contentWindow.focus();
            } catch(e) {}
        });

        // Forward arrow and WASD keys when parent has focus
        window.addEventListener('keydown', (e) => {
            const active = document.activeElement;
            if (active !== gameFrame) {
                const k = e.key.toLowerCase();
                if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'e', 'escape', 'enter'].includes(k)) {
                    try {
                        gameFrame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
                            key: e.key,
                            code: e.code,
                            bubbles: true
                        }));
                    } catch(err) {}
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const active = document.activeElement;
            if (active !== gameFrame) {
                const k = e.key.toLowerCase();
                if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'e', 'escape', 'enter'].includes(k)) {
                    try {
                        gameFrame.contentWindow.dispatchEvent(new KeyboardEvent('keyup', {
                            key: e.key,
                            code: e.code,
                            bubbles: true
                        }));
                    } catch(err) {}
                }
            }
        });

        // Fullscreen Toggle
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                gameContainer.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
